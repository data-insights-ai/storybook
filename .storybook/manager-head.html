<style>
  @font-face {
    font-family: "IBM Plex Sans";
    font-weight: 400;
    font-display: swap;
    src: url("./fonts/ibm-plex-sans/ibm-plex-sans-latin-400-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "IBM Plex Sans";
    font-weight: 500;
    font-display: swap;
    src: url("./fonts/ibm-plex-sans/ibm-plex-sans-latin-500-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "IBM Plex Sans";
    font-weight: 600;
    font-display: swap;
    src: url("./fonts/ibm-plex-sans/ibm-plex-sans-latin-600-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "IBM Plex Sans";
    font-weight: 700;
    font-display: swap;
    src: url("./fonts/ibm-plex-sans/ibm-plex-sans-latin-700-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "IBM Plex Mono";
    font-weight: 400;
    font-display: swap;
    src: url("./fonts/ibm-plex-mono/ibm-plex-mono-latin-400-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "IBM Plex Mono";
    font-weight: 500;
    font-display: swap;
    src: url("./fonts/ibm-plex-mono/ibm-plex-mono-latin-500-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Space Grotesk";
    font-weight: 700;
    font-display: swap;
    src: url("./fonts/space-grotesk/space-grotesk-latin-700-normal.woff2") format("woff2");
  }

  body {
    font-size: 14px;
  }

  .sidebar-header img {
    height: 28px !important;
    width: auto !important;
    max-height: 28px !important;
  }

  #storybook-checklist-widget {
    display: none !important;
  }

  /* Kinds of entry are told apart by shape; colour is kept for the selection. */
  .sidebar-item svg {
    color: var(--sb-di-subtle) !important;
  }

  /* Selection is a line: the selected story is a raised neutral tone with a cornflower edge, never a fill. */
  .sidebar-item[data-selected="true"],
  .sidebar-item[data-selected="true"]:hover {
    background: var(--sb-di-raised) !important;
    color: var(--sb-di-text) !important;
    font-weight: 600 !important;
    box-shadow: inset 3px 0 0 var(--sb-di-select);
  }

  .sidebar-item[data-selected="true"] svg,
  .sidebar-item[data-selected="true"] a,
  .sidebar-item[data-selected="true"] button {
    color: inherit !important;
  }

  .sidebar-item[data-selected="true"] svg {
    color: var(--sb-di-select) !important;
  }

  /* Group labels are labels: the mono track, like a navigation group in the product. */
  .sidebar-subheading,
  .sidebar-subheading button {
    font-family: "IBM Plex Mono", ui-monospace, monospace !important;
    font-weight: 500 !important;
    letter-spacing: 0.1em !important;
    color: var(--sb-di-subtle) !important;
  }

  #storybook-explorer-searchfield {
    font-size: 14px;
  }
</style>
