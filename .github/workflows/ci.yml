name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: |
          node --input-type=module <<'EOF'
          import { existsSync, readFileSync } from "node:fs";
          for (const file of ["dist/lib/index.js", "dist/lib/styles.css", "dist/lib/index.d.ts"]) {
            if (!existsSync(file)) {
              console.error("missing " + file);
              process.exit(1);
            }
          }
          const types = readFileSync("dist/lib/index.d.ts", "utf8");
          if (!types.includes("Button")) {
            console.error("package types do not export Button");
            process.exit(1);
          }
          EOF
      - run: pnpm build-storybook
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        with:
          name: storybook
          path: dist/storybook
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@data-insights-ai"
      - run: pnpm install --frozen-lockfile
      - run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";
          const version = JSON.parse(readFileSync("package.json", "utf8")).version;
          const tag = process.env.GITHUB_REF.slice("refs/tags/v".length);
          if (tag !== version) {
            console.error("Tag v" + tag + " does not match package.json " + version);
            process.exit(1);
          }
          EOF
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    if: |
      always() &&
      needs.test.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    needs: [test, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: storybook
          path: dist/storybook
      - run: test -f dist/storybook/index.html
      - name: Validate required secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD must be set on this repository."
            exit 1
          fi
      - name: Upload to Hetzner
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp --env-password -u "$FTP_USERNAME" "ftp://$FTP_SERVER" <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:timeout 30
          set cmd:fail-exit no
          pwd
          cls -1 storybook.data-insights.ai/public
          set cmd:fail-exit yes
          mirror --reverse --verbose --parallel=1 dist/storybook storybook.data-insights.ai/public
          bye
          EOF
